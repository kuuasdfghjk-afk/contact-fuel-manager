services:
  - type: web
    name: contact-fuel-manager
    runtime: python
    plan: free
    buildCommand: "echo 'Build complete'"
    startCommand: "python3 server.py"
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SMTP_PASS
        sync: false
